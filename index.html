<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />

    <style>
      :root {
        --color-base-dark: #151515;
        --color-accent-plum: #3e2d34;
        --color-slate: #5c5e5e;
        --color-surface: #d3d1d0;
        --color-canvas: #f4f4f4;
      }

      @import url("https://fonts.googleapis.com/css2?family=Syne:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--color-surface);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "IBM Plex Mono", monospace;
        padding: 2rem;
      }

      .container {
        background: var(--color-canvas);
        border: 4px solid var(--color-base-dark);
        box-shadow: 8px 8px 0px var(--color-base-dark);
        padding: 3rem;
        max-width: 600px;
        width: 100%;
        text-align: center;
        animation: reveal 0.8s ease-out;
        transition: all 0.2s ease;
      }

      .container:hover {
        box-shadow: 4px 4px 0px var(--color-base-dark);
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 0;
        margin-bottom: 2rem;
        animation: popIn 0.6s ease-out 0.2s both;
      }

      @keyframes popIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      h1 {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 2rem;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        color: var(--color-base-dark);
        margin-bottom: 1.5rem;
        animation: fadeIn 0.6s ease-out 0.4s both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .links {
        display: flex;
        gap: 1rem;
        justify-content: center;
        animation: slideUp 0.6s ease-out 0.6s both;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .link-button {
        background: var(--color-accent-plum);
        color: var(--color-surface);
        border: 2px solid var(--color-base-dark);
        padding: 0.75rem 1.5rem;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 0.875rem;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        box-shadow: 3px 3px 0px var(--color-base-dark);
        transition: all 0.15s ease;
        display: inline-block;
      }

      .link-button:hover {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px var(--color-base-dark);
        background: var(--color-base-dark);
        color: var(--color-surface);
      }

      .divider {
        color: var(--color-slate);
        font-weight: 500;
        align-self: center;
      }

      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }

        .container {
          padding: 2rem;
        }

        h1 {
          font-size: 1.5rem;
        }

        .links {
          flex-direction: column;
          align-items: center;
        }

        .divider {
          display: none;
        }
      }
    </style>

    <title>Jer Basuki Mowo Beyo</title>
  </head>
  <body>
    <div class="container">
      <img class="avatar" src="images/logo.webp" alt="Profile Avatar" />
      <h1>Jer Basuki Mowo Beyo</h1>
      <div class="links">
        <a
          href="https://adzkar.github.io/blog"
          target="_blank"
          class="link-button"
          >Blog</a
        >
      </div>
    </div>
  </body>
</html>
